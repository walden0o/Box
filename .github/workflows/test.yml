name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKDIR=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "sdk.dir=$SDKDIR" > local.properties
          yes | $SDKDIR/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDKDIR/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "build-tools;34.0.0"
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleArm64GenericNormalRelease :app:assembleArmeabiGenericNormalRelease --build-cache --parallel --daemon --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find . -name "*.apk" -print`; do
            mv "$file" ${{ github.workspace }}/apk/
          done
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*
